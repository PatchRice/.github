name: "✨ Feature request / 功能建议"
description: "Suggest a feature or improvement / 提出新功能或改进已有功能"
labels:
  - C-enhancement
  - S-needs-triage
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: "Duplicate check / 重复检查"
      description: "Search open and closed issues first. If a matching issue exists, add context there. / 请先搜索开放及已关闭的 Issue；已有同类问题时，请在原 Issue 下补充。"
      options:
        - label: "I have searched open and closed issues and confirmed this is not a duplicate. / 我已搜索开放及已关闭的 Issue，确认没有重复问题。"
          required: true
  - type: markdown
    attributes:
      value: |
        Describe the problem and desired outcome. Implementation details are welcome but not required.
        请说明要解决的问题及希望达到的效果；不要求提供实现方案。
  - type: textarea
    id: problem
    attributes:
      label: "Problem or use case / 需求背景"
      description: "Who needs this and when? What is hard or impossible today? / 什么场景下存在什么困难？"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed behavior / 期望的功能"
      description: "Describe the expected user-visible result. / 描述期望的行为与效果。"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Success criteria / 验收标准"
      description: "How would we know this works? Optional but helpful. / 怎样判断该功能已实现？可选。"
      placeholder: "- [ ] ..."
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives and trade-offs / 替代方案及取舍"
      description: "Workarounds, alternatives, compatibility concerns or non-goals. / 已尝试方案、兼容性顾虑或非目标。"
  - type: textarea
    id: context
    attributes:
      label: "References or mockups / 参考材料"
      description: "Related issues, screenshots, designs or links. / 相关 Issue、图片、设计或链接。"
