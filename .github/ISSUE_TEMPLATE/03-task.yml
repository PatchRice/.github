name: "🛠️ Maintenance task / 维护与重构任务"
description: "Track refactoring, dependency upgrades, CI, tests and technical debt / 跟踪维护工作"
labels:
  - C-maintenance
  - S-needs-triage
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: "Duplicate check / 重复检查"
      description: "Search open and closed issues first. If a matching issue exists, add context there. / 请先搜索开放及已关闭的 Issue；已有同类问题时，请在原 Issue 下补充。"
      options:
        - label: "I have searched open and closed issues and confirmed this is not a duplicate. / 我已搜索开放及已关闭的 Issue，确认没有重复问题。"
          required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Task type / 任务类型"
      options:
        - Refactor / 重构
        - Dependency upgrade / 依赖升级
        - Build or CI / 构建与持续集成
        - Tests / 测试
        - Performance or reliability / 性能与可靠性
        - Other maintenance / 其他维护
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: "Background and objective / 背景与目标"
      description: "Why is the task needed and what outcome is expected? / 为什么需要完成这项任务？"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope / 工作范围"
      description: "What should change and what is out of scope? / 涉及范围与明确不做的部分。"
  - type: textarea
    id: completion
    attributes:
      label: "Definition of done / 完成标准"
      description: "Describe how to verify completion; a short checklist is fine. / 可用简短清单列出可验证的完成条件。"
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies and risks / 依赖与风险"
      description: "Related issues/PRs, blockers or migration concerns. / 关联任务、阻塞事项与迁移风险。"
